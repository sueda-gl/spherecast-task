version: '3.8'

services:
  spherecast:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./audit_storage:/app/audit_storage
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

