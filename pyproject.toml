[project]
name = "spherecast"
version = "0.1.0"
description = "Purchase Order Extraction System using LLM"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0.0",
    "openai>=1.52.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

